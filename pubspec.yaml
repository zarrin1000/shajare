name: shajare
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1 # این نسخه را در بروزرسانی‌های بعدی تغییر دهید (مثلاً 1.0.1+2)

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # پکیج‌های اصلی پروژه شما
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.0
  local_auth: ^2.2.0
  permission_handler: ^11.3.1
  file_picker: ^8.0.5
  path_provider: ^2.1.1
  device_info_plus: ^10.1.0
  shimmer: ^3.0.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8

  # پکیج‌های جدید برای سیستم بروزرسانی و لوگو
  package_info_plus: ^8.0.0
  open_file: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1 # پکیج ساخت لوگو

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png # مسیر لوگوی شما

# تنظیمات ساخت لوگو (باید دقیقاً در انتهای فایل باشد)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21